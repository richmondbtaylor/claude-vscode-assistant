[project]
name = "vidforge"
version = "0.1.0"
description = "Local uncensored video generation - queue, batch prompts, gallery, web UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    # bundles its own ffmpeg, so MP4 output works without a system install
    "imageio[ffmpeg]>=2.35",
    "numpy>=1.26",
    # pure-python QR, for the phone link printed by `serve --tunnel`
    "segno>=1.6",
]

[project.optional-dependencies]
# Local GPU inference. Install torch for your CUDA/ROCm build first:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu124
diffusers = [
    "diffusers>=0.32",
    "transformers>=4.44",
    "accelerate>=0.34",
    "sentencepiece>=0.2",
    "safetensors>=0.4",
]

[project.scripts]
vidforge = "vidforge.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vidforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
