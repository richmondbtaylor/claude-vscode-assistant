<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="sarev.css"><script src="gsap.min.js"></script></head>
<body><div class="card">
  <div style="position:absolute;left:70px;top:70px" class="tag"><span class="dot"></span>New video</div>
  <div id="title" class="display" style="position:absolute;left:70px;top:190px;font-size:96px;max-width:940px">
    Build your<br><span class="brush">AI Operating System</span></div>
  <div id="sub" class="display" style="position:absolute;left:70px;top:610px;font-size:60px;color:#1E2333;max-width:940px;opacity:0">
    Become a <span class="blue">Master Prompt Engineer</span> in minutes</div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.set({}, {}, 9.9);
  tl.from("#title", { y: 70, opacity: 0, duration: .55, ease: "power3.out" }, 0.05);
  tl.to("#title .brush", { scale: 1.02, transformOrigin: "left center", duration: .35, yoyo: true, repeat: 1 }, 1.6);
  tl.to("#sub", { opacity: 1, y: 0, startAt: { y: 40 }, duration: .5, ease: "power3.out" }, 3.4);
  tl.to("#sub .blue", { color: "#0f6f99", duration: .4, yoyo: true, repeat: 1 }, 5.0);
  tl.to("#title .brush", { scale: 1.02, transformOrigin: "left center", duration: .35, yoyo: true, repeat: 1 }, 6.4);
  tl.to("#sub .blue", { color: "#0f6f99", duration: .4, yoyo: true, repeat: 1 }, 7.7);
  tl.to("#title", { scale: 1.01, transformOrigin: "left top", duration: .35, yoyo: true, repeat: 1 }, 9.0);
  window.seekTo = t => { tl.seek(Math.min(t, tl.duration() - 0.001), false); };
  window.cardReady = Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3000))]);
</script></body></html>
