<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="sarev.css"><script src="gsap.min.js"></script>
<style>
  .grid { position: absolute; left: 60px; top: 250px; display: grid;
          grid-template-columns: repeat(3, 312px); grid-template-rows: repeat(2, 240px); gap: 24px; }
  .tile { border: 5px solid #E6E2DE; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 18px; }
  .tile .label { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 30px;
                 letter-spacing: .1em; text-transform: uppercase; color: #1E2333; }
  .tile svg { width: 96px; height: 96px; }
  #band { position: absolute; left: 0; bottom: 0; width: 1080px; height: 130px;
          background: #000814; display: flex; align-items: center; justify-content: center; }
  #band .display { color: #F9F6F0; font-size: 42px; font-weight: 800; }
</style></head>
<body><div class="card">
  <div style="position:absolute;left:70px;top:60px" class="tag"><span class="dot"></span>One folder</div>
  <div id="title" class="display" style="position:absolute;left:70px;top:120px;font-size:72px">
    Build <span class="gold">anything</span></div>
  <div class="grid">
    <div class="tile panel" id="t1"><svg viewBox="0 0 100 100" fill="none"><rect x="22" y="34" width="56" height="44" rx="12" stroke="#000814" stroke-width="6"/><circle cx="40" cy="56" r="5" fill="#E0B848"/><circle cx="60" cy="56" r="5" fill="#E0B848"/><line x1="50" y1="34" x2="50" y2="20" stroke="#000814" stroke-width="6"/><circle cx="50" cy="16" r="6" fill="#E0B848"/></svg><div class="label">Agent</div></div>
    <div class="tile panel" id="t2"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="36" r="16" stroke="#000814" stroke-width="6"/><path d="M20 84 C20 62 34 56 50 56 C66 56 80 62 80 84" stroke="#000814" stroke-width="6"/><circle cx="72" cy="30" r="10" fill="#E0B848"/></svg><div class="label">Employee</div></div>
    <div class="tile panel" id="t3"><svg viewBox="0 0 100 100" fill="none"><rect x="12" y="20" width="26" height="22" rx="6" stroke="#000814" stroke-width="6"/><rect x="62" y="20" width="26" height="22" rx="6" stroke="#000814" stroke-width="6"/><rect x="37" y="60" width="26" height="22" rx="6" fill="#E0B848"/><path d="M25 42 L25 52 L50 52 L50 60 M75 42 L75 52 L50 52" stroke="#000814" stroke-width="6"/></svg><div class="label">Workflow</div></div>
    <div class="tile panel" id="t4"><svg viewBox="0 0 100 100" fill="none"><rect x="14" y="22" width="72" height="56" rx="10" stroke="#000814" stroke-width="6"/><line x1="14" y1="38" x2="86" y2="38" stroke="#000814" stroke-width="6"/><circle cx="26" cy="30" r="4" fill="#E0B848"/><circle cx="38" cy="30" r="4" fill="#E0B848"/></svg><div class="label">Web app</div></div>
    <div class="tile panel" id="t5"><svg viewBox="0 0 100 100" fill="none"><rect x="16" y="20" width="68" height="60" rx="10" stroke="#000814" stroke-width="6"/><circle cx="38" cy="40" r="8" fill="#E0B848"/><path d="M22 74 L46 52 L60 64 L72 54 L80 62" stroke="#000814" stroke-width="6"/></svg><div class="label">Image</div></div>
    <div class="tile panel" id="t6"><svg viewBox="0 0 100 100" fill="none"><rect x="14" y="26" width="72" height="48" rx="12" stroke="#000814" stroke-width="6"/><path d="M44 40 L62 50 L44 60 Z" fill="#E0B848"/></svg><div class="label">Video</div></div>
  </div>
  <div id="band"><div class="display">One prompt away&nbsp;&nbsp;·&nbsp;&nbsp;<span class="blue">promptanything.io</span></div></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.set({}, {}, 7.57);
  tl.from("#title", { y: 50, opacity: 0, duration: .4, ease: "power3.out" }, 0.05);
  const tiles = ["#t1", "#t2", "#t3", "#t4", "#t5", "#t6"];
  [0.35, 1.0, 1.65, 2.35, 3.05, 3.45].forEach((at, i) => {
    tl.from(tiles[i], { scale: .8, opacity: 0, duration: .4, ease: "back.out(1.7)" }, at);
  });
  tl.from("#band", { y: 130, duration: .5, ease: "power3.out" }, 4.7);
  tl.to("#band .blue", { color: "#5fc4ec", duration: .35, yoyo: true, repeat: 1 }, 6.0);
  tl.to("#title .gold", { color: "#c9a23c", duration: .35, yoyo: true, repeat: 1 }, 6.9);
  window.seekTo = t => { tl.seek(Math.min(t, tl.duration() - 0.001), false); };
  window.cardReady = Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3000))]);
</script></body></html>
