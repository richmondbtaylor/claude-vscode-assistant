<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css"><script src="gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  .stage { position: relative; width: 1080px; height: 1920px; }
  .wordblock { position: absolute; left: 0; width: 1080px; text-align: center;
               font-family: 'Poppins', sans-serif; font-weight: 900; color: #FFFFFF;
               text-shadow: 0 4px 24px rgba(0,8,20,.85), 0 2px 6px rgba(0,8,20,.9);
               letter-spacing: -0.01em; line-height: 1.04; }
  .gold { color: #E0B848; }
  #b1 { top: 150px; font-size: 110px; }
  #b2 { top: 150px; font-size: 96px; opacity: 0; }
  #b3 { top: 130px; font-size: 104px; opacity: 0; }
  #uline { position: absolute; left: 290px; top: 415px; width: 0; height: 12px;
           background: #E0B848; border-radius: 6px; box-shadow: 0 3px 14px rgba(0,8,20,.6); }
</style></head>
<body><div class="stage">
  <div class="wordblock" id="b1"><span id="b1a">BEGINNER</span> <span class="gold" id="b1b">or PRO</span></div>
  <div class="wordblock" id="b2">Where do you<br>even <span class="gold">start?</span></div>
  <div class="wordblock" id="b3">AUTOMATE<br><span style="font-size:76px">without lifting <span class="gold">a finger</span></span></div>
  <div id="uline"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.set({}, {}, 12.7);
  // visible AT 0:00 (open on overlay), pop settles immediately after
  tl.from("#b1", { scale: .92, duration: .3, ease: "back.out(2)" }, 0.01);
  tl.from("#b1b", { opacity: 0, y: 30, duration: .4, ease: "power3.out" }, 1.5);
  tl.to("#b1b", { color: "#c9a23c", duration: .35, yoyo: true, repeat: 1 }, 2.9);
  tl.to("#b1", { opacity: 0, y: -30, duration: .35 }, 3.9);
  tl.to("#b2", { opacity: 1, y: 0, startAt: { y: 40 }, duration: .45, ease: "power3.out" }, 4.15);
  tl.to("#uline", { width: 500, duration: .5, ease: "power2.inOut" }, 5.4);
  tl.to("#b2 .gold", { color: "#c9a23c", duration: .35, yoyo: true, repeat: 1 }, 6.4);
  tl.to(["#b2", "#uline"], { opacity: 0, y: -30, duration: .35 }, 7.3);
  tl.to("#b3", { opacity: 1, y: 0, startAt: { y: 40 }, duration: .45, ease: "power3.out" }, 7.6);
  tl.to("#b3 .gold", { color: "#c9a23c", duration: .4, yoyo: true, repeat: 1 }, 9.2);
  tl.to("#b3", { scale: 1.04, transformOrigin: "center top", duration: .35, yoyo: true, repeat: 1 }, 10.6);
  tl.to("#b3 .gold", { color: "#c9a23c", duration: .4, yoyo: true, repeat: 1 }, 11.8);
  window.seekTo = t => { tl.seek(Math.min(t, tl.duration() - 0.001), false); };
  window.cardReady = Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3000))]);
</script></body></html>
