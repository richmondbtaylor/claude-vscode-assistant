<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="brand.css"><script src="gsap.min.js"></script>
<style>
  .node { position: absolute; display: flex; align-items: center; justify-content: center;
          text-align: center; font-family: 'Poppins', sans-serif; font-weight: 800;
          color: #000813; border: 6px solid #E6E2DE; }
  #idea { left: 200px; top: 620px; width: 460px; height: 170px; font-size: 54px; }
  #orch { left: 950px; top: 570px; width: 640px; height: 270px; font-size: 72px;
          border: 8px solid #E0B848; }
  #eff  { position: absolute; left: 1740px; top: 640px; width: 640px; font-family: 'Open Sans', sans-serif;
          font-weight: 600; font-size: 46px; color: #1894C9; line-height: 1.3; }
  .skill { width: 340px; height: 120px; font-size: 40px; top: 1050px; }
  #s1 { left: 780px; } #s2 { left: 1160px; } #s3 { left: 1540px; }
  .sub { width: 280px; height: 96px; font-size: 32px; top: 1260px; background: #FAFBFA;
         border: 5px dashed #1D2333; border-radius: 20px; }
  #u1 { left: 1080px; } #u2 { left: 1400px; }
  svg.wires { position: absolute; left: 0; top: 0; width: 2560px; height: 1440px; pointer-events: none; }
  .wire { stroke: #1D2333; stroke-width: 6; fill: none; }
</style></head>
<body><div class="card">
  <div style="position:absolute;left:90px;top:90px" class="tag"><span class="dot"></span>Your first skill</div>
  <div id="title" class="display" style="position:absolute;left:90px;top:170px;font-size:130px">
    The <span class="gold">Orchestrator</span> Agent</div>
  <svg class="wires">
    <path id="w1" class="wire" d="M660 705 L950 705"/>
    <path id="w2" class="wire" d="M1270 840 L950 1050"/>
    <path id="w3" class="wire" d="M1270 840 L1330 1050"/>
    <path id="w4" class="wire" d="M1270 840 L1710 1050"/>
    <path id="w5" class="wire" d="M1330 1170 L1220 1260"/>
    <path id="w6" class="wire" d="M1330 1170 L1540 1260"/>
    <circle id="pulse" r="11" fill="#E0B848" opacity="0"/>
  </svg>
  <div class="node panel" id="idea">Your idea</div>
  <div class="node panel" id="orch">Orchestrator</div>
  <div id="eff">finds the most efficient way to get it done</div>
  <div class="node panel skill" id="s1">Skill</div>
  <div class="node panel skill" id="s2">Skill</div>
  <div class="node panel skill" id="s3">Skill</div>
  <div class="node sub" id="u1">Sub-skill</div>
  <div class="node sub" id="u2">Sub-skill</div>
  <div class="footer">Bishop AI</div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.set({}, {}, 19.05);
  document.querySelectorAll(".wire").forEach(w => {
    const L = w.getTotalLength(); w.style.strokeDasharray = L; w.style.strokeDashoffset = L;
  });
  tl.from("#title", { y: 60, opacity: 0, duration: .5, ease: "power3.out" }, 0.05);
  tl.from("#idea", { scale: .8, opacity: 0, duration: .5, ease: "back.out(1.7)" }, 0.6);
  tl.to("#w1", { strokeDashoffset: 0, duration: .6, ease: "power2.inOut" }, 3.3);
  tl.from("#orch", { scale: .8, opacity: 0, duration: .6, ease: "back.out(1.7)" }, 3.9);
  tl.from("#eff", { x: 60, opacity: 0, duration: .6, ease: "power3.out" }, 9.0);
  tl.to(["#w2", "#w3", "#w4"], { strokeDashoffset: 0, duration: .5, stagger: .3, ease: "power2.inOut" }, 13.0);
  tl.from(["#s1", "#s2", "#s3"], { y: 60, opacity: 0, duration: .5, stagger: .3, ease: "back.out(1.5)" }, 13.3);
  tl.to(["#w5", "#w6"], { strokeDashoffset: 0, duration: .5, stagger: .3, ease: "power2.inOut" }, 16.3);
  tl.from(["#u1", "#u2"], { y: 40, opacity: 0, duration: .5, stagger: .3, ease: "back.out(1.5)" }, 16.6);
  // gold dot travels idea -> orchestrator repeatedly from 5s so motion never stops
  const wire = document.getElementById("w1");
  for (let at = 5.0; at < 18.6; at += 1.4) {
    tl.to("#pulse", { opacity: 1, duration: .1 }, at);
    tl.to("#pulse", { duration: 1.0, ease: "power1.inOut",
      onUpdate: function () {
        const pr = this.progress(), pt = wire.getPointAtLength(pr * wire.getTotalLength());
        gsap.set("#pulse", { attr: { cx: pt.x, cy: pt.y } });
      } }, at);
    tl.to("#pulse", { opacity: 0, duration: .2 }, at + 1.0);
  }
  window.seekTo = t => { tl.seek(Math.min(t, tl.duration() - 0.001), false); };
  window.cardReady = Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3000))]);
</script></body></html>
