<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="brand.css"><script src="gsap.min.js"></script>
<style>
  .grid { position: absolute; left: 240px; top: 360px; display: grid;
          grid-template-columns: repeat(3, 640px); grid-template-rows: repeat(2, 340px);
          gap: 40px; }
  .tile { border: 6px solid #E6E2DE; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 30px; }
  .tile .label { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 44px;
                 letter-spacing: .12em; text-transform: uppercase; color: #1D2333; }
  .tile svg { width: 150px; height: 150px; }
  #band { position: absolute; left: 0; bottom: 0; width: 2560px; height: 190px;
          background: #000813; display: flex; align-items: center; justify-content: center; }
  #band .display { color: #FAFBFA; font-size: 64px; font-weight: 800; }
</style></head>
<body><div class="card">
  <div style="position:absolute;left:90px;top:90px" class="tag"><span class="dot"></span>Your AI Operating System</div>
  <div id="title" class="display" style="position:absolute;left:90px;top:170px;font-size:120px">
    Build <span class="gold">anything</span> you can describe</div>
  <div class="grid">
    <div class="tile panel" id="t1"><svg viewBox="0 0 100 100" fill="none">
      <rect x="22" y="34" width="56" height="44" rx="12" stroke="#000813" stroke-width="6"/>
      <circle cx="40" cy="56" r="5" fill="#E0B848"/><circle cx="60" cy="56" r="5" fill="#E0B848"/>
      <line x1="50" y1="34" x2="50" y2="20" stroke="#000813" stroke-width="6"/><circle cx="50" cy="16" r="6" fill="#E0B848"/></svg>
      <div class="label">Agent</div></div>
    <div class="tile panel" id="t2"><svg viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="36" r="16" stroke="#000813" stroke-width="6"/>
      <path d="M20 84 C20 62 34 56 50 56 C66 56 80 62 80 84" stroke="#000813" stroke-width="6"/>
      <circle cx="72" cy="30" r="10" fill="#E0B848"/></svg>
      <div class="label">Employee</div></div>
    <div class="tile panel" id="t3"><svg viewBox="0 0 100 100" fill="none">
      <rect x="12" y="20" width="26" height="22" rx="6" stroke="#000813" stroke-width="6"/>
      <rect x="62" y="20" width="26" height="22" rx="6" stroke="#000813" stroke-width="6"/>
      <rect x="37" y="60" width="26" height="22" rx="6" fill="#E0B848"/>
      <path d="M25 42 L25 52 L50 52 L50 60 M75 42 L75 52 L50 52" stroke="#000813" stroke-width="6"/></svg>
      <div class="label">Workflow</div></div>
    <div class="tile panel" id="t4"><svg viewBox="0 0 100 100" fill="none">
      <rect x="14" y="22" width="72" height="56" rx="10" stroke="#000813" stroke-width="6"/>
      <line x1="14" y1="38" x2="86" y2="38" stroke="#000813" stroke-width="6"/>
      <circle cx="26" cy="30" r="4" fill="#E0B848"/><circle cx="38" cy="30" r="4" fill="#E0B848"/></svg>
      <div class="label">Web app</div></div>
    <div class="tile panel" id="t5"><svg viewBox="0 0 100 100" fill="none">
      <rect x="16" y="20" width="68" height="60" rx="10" stroke="#000813" stroke-width="6"/>
      <circle cx="38" cy="40" r="8" fill="#E0B848"/>
      <path d="M22 74 L46 52 L60 64 L72 54 L80 62" stroke="#000813" stroke-width="6"/></svg>
      <div class="label">Image</div></div>
    <div class="tile panel" id="t6"><svg viewBox="0 0 100 100" fill="none">
      <rect x="14" y="26" width="72" height="48" rx="12" stroke="#000813" stroke-width="6"/>
      <path d="M44 40 L62 50 L44 60 Z" fill="#E0B848"/></svg>
      <div class="label">Video</div></div>
  </div>
  <div id="band"><div class="display">Built with strong prompts&nbsp;&nbsp;·&nbsp;&nbsp;<span class="blue">promptanything.io</span></div></div>
  <div class="footer">Bishop AI</div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.set({}, {}, 16.4);
  tl.from("#title", { y: 60, opacity: 0, duration: .5, ease: "power3.out" }, 0.05);
  const tiles = ["#t1", "#t2", "#t3", "#t4", "#t5", "#t6"];
  tiles.forEach((t, i) => {
    tl.from(t, { scale: .8, opacity: 0, duration: .45, ease: "back.out(1.7)" }, i * 0.8);
  });
  // filler pulses between last tile and the band (visible change <= every 1.5s)
  [4.8, 6.0].forEach((at, i) => {
    tl.to(tiles[i * 3], { borderColor: "#E0B848", duration: .35, yoyo: true, repeat: 1 }, at);
    tl.to(tiles[i * 3 + 1], { borderColor: "#E0B848", duration: .35, yoyo: true, repeat: 1 }, at + .4);
  });
  tl.from("#band", { y: 190, duration: .6, ease: "power3.out" }, 7.4);
  // post-band fillers through the 16.4s hold
  [9.0, 10.4, 11.8, 13.2, 14.6].forEach((at, i) => {
    tl.to(tiles[i % 6], { scale: 1.04, duration: .3, yoyo: true, repeat: 1, ease: "power2.inOut" }, at);
  });
  tl.to("#band .blue", { color: "#5fc4ec", duration: .4, yoyo: true, repeat: 1 }, 15.4);
  window.seekTo = t => { tl.seek(Math.min(t, tl.duration() - 0.001), false); };
  window.cardReady = Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3000))]);
</script></body></html>
