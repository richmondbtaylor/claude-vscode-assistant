<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code - Unreleased Features</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@800&family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #0B0F19;
    overflow: hidden;
  }

  .slideshow {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  .slide {
    width: 1080px; height: 1080px;
    position: absolute;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    background: #FAFBFA;
    padding: 80px;
    opacity: 0;
    transform: scale(0.92);
    transition: opacity 0.8s cubic-bezier(0.4,0,0.2,1),
                transform 0.8s cubic-bezier(0.4,0,0.2,1);
    pointer-events: none;
    border-radius: 4px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.4);
  }
  .slide.active { opacity: 1; transform: scale(1); pointer-events: auto; z-index: 10; }
  .slide.prev { opacity: 0; transform: scale(1.06); }
  .slide.next { opacity: 0; transform: scale(0.88); }

  @media (max-height: 1100px) {
    .slideshow { transform: scale(calc(100vh / 1140)); }
  }

  /* corners */
  .corner-tl {
    position: absolute; top: 32px; left: 32px;
    width: 40px; height: 40px;
    border-top: 3px solid #E0B848; border-left: 3px solid #E0B848;
    opacity: 0; transform: translate(-10px,-10px);
    transition: opacity 0.6s 0.3s ease, transform 0.6s 0.3s ease;
  }
  .corner-br {
    position: absolute; bottom: 32px; right: 32px;
    width: 40px; height: 40px;
    border-bottom: 3px solid #E0B848; border-right: 3px solid #E0B848;
    opacity: 0; transform: translate(10px,10px);
    transition: opacity 0.6s 0.3s ease, transform 0.6s 0.3s ease;
  }
  .slide.active .corner-tl,
  .slide.active .corner-br { opacity: 1; transform: translate(0,0); }

  /* gold line */
  .gold-line {
    width: 48px; height: 4px; background: #E0B848;
    border-radius: 2px; margin-bottom: 18px;
    opacity: 0; transform: scaleX(0); transform-origin: left;
    transition: opacity 0.5s 0.2s ease, transform 0.5s 0.2s cubic-bezier(0.4,0,0.2,1);
    position: relative; z-index: 2;
  }
  .slide.active .gold-line { opacity: 1; transform: scaleX(1); }

  /* title */
  h1 {
    font-family: 'Poppins', sans-serif;
    font-weight: 800; font-size: 64px;
    color: #000813; line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 16px;
    position: relative; z-index: 2;
    opacity: 0; transform: translateY(24px);
    transition: opacity 0.7s 0.35s ease, transform 0.7s 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  .tagline {
    font-family: 'Montserrat', sans-serif;
    font-weight: 500; font-size: 22px;
    color: #1D2333;
    position: relative; z-index: 2; line-height: 1.4;
    opacity: 0; transform: translateY(16px);
    transition: opacity 0.6s 0.55s ease, transform 0.6s 0.55s ease;
  }
  .slide.active h1,
  .slide.active .tagline { opacity: 1; transform: translateY(0); }

  /* list items */
  .items {
    display: flex; flex-direction: column;
    gap: 24px; position: relative; z-index: 2;
    flex: 1;
  }
  .item {
    display: flex; align-items: flex-start; gap: 20px;
    opacity: 0; transform: translateY(14px);
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .slide.active .item { opacity: 1; transform: translateY(0); }
  .slide.active .item:nth-child(1) { transition-delay: 0.4s; }
  .slide.active .item:nth-child(2) { transition-delay: 0.52s; }
  .slide.active .item:nth-child(3) { transition-delay: 0.64s; }
  .slide.active .item:nth-child(4) { transition-delay: 0.76s; }
  .slide.active .item:nth-child(5) { transition-delay: 0.88s; }
  .slide.active .item:nth-child(6) { transition-delay: 1.0s; }

  .item-marker {
    min-width: 36px; height: 36px;
    background: #000813; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700; font-size: 13px; color: #E0B848;
    margin-top: 1px;
  }
  .item-name {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700; font-size: 18px;
    color: #000813; line-height: 1.2;
    margin-bottom: 4px;
  }
  .item-desc {
    font-family: 'Open Sans', sans-serif;
    font-weight: 400; font-size: 14.5px;
    color: #1D2333; line-height: 1.5;
  }

  /* accent markers for different slide themes */
  .slide-workflow .item-marker { background: #1894C9; color: #fff; }
  .slide-prep .item-marker { background: #E0B848; color: #000813; }
  .slide-action .item-marker { background: #000813; color: #E0B848; }

  /* ── GRAPHIC CONTAINERS ── */
  .gfx {
    position: absolute;
    opacity: 0; transform: translateX(30px) scale(0.95);
    transition: opacity 0.9s 0.15s ease, transform 0.9s 0.15s cubic-bezier(0.4,0,0.2,1);
  }
  .slide.active .gfx { opacity: 1; transform: translateX(0) scale(1); }

  /* ═════ SLIDE 1: RADAR (discovery) ═════ */
  .gfx-radar {
    top: 50px; right: 40px; width: 420px; height: 420px;
  }
  .gfx-radar .ring {
    position: absolute; border-radius: 50%;
    border: 2px solid rgba(0,8,19,0.05);
    top: 50%; left: 50%; transform: translate(-50%,-50%);
  }
  .gfx-radar .r1 { width: 380px; height: 380px; }
  .gfx-radar .r2 { width: 270px; height: 270px; }
  .gfx-radar .r3 { width: 160px; height: 160px; }
  .gfx-radar .r4 { width: 70px; height: 70px; border-color: rgba(224,184,72,0.15); }
  .gfx-radar .core {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 20px; height: 20px; background: #E0B848; border-radius: 50%;
    box-shadow: 0 0 0 10px rgba(224,184,72,0.12), 0 0 0 22px rgba(224,184,72,0.06);
  }
  @keyframes pulse-core {
    0%,100% { box-shadow: 0 0 0 10px rgba(224,184,72,0.12), 0 0 0 22px rgba(224,184,72,0.06); }
    50% { box-shadow: 0 0 0 16px rgba(224,184,72,0.18), 0 0 0 30px rgba(224,184,72,0.08); }
  }
  .slide.active .gfx-radar .core { animation: pulse-core 3s ease-in-out infinite; }
  .gfx-radar .sweep {
    position: absolute; top: 50%; left: 50%;
    width: 190px; height: 2px;
    background: linear-gradient(90deg, #E0B848, transparent);
    transform-origin: left center; opacity: 0.4;
  }
  @keyframes radar-sweep { 0% { transform: rotate(-35deg); } 100% { transform: rotate(325deg); } }
  .slide.active .gfx-radar .sweep { animation: radar-sweep 6s linear infinite; }
  .gfx-radar .blip { position: absolute; border-radius: 50%; background: #1894C9; }
  .gfx-radar .bp1 { width: 10px; height: 10px; top: 65px; left: 230px; }
  .gfx-radar .bp2 { width: 8px; height: 8px; top: 155px; left: 325px; }
  .gfx-radar .bp3 { width: 12px; height: 12px; top: 265px; left: 80px; }
  .gfx-radar .bp4 { width: 7px; height: 7px; top: 115px; left: 120px; }
  .gfx-radar .bp5 { width: 9px; height: 9px; top: 300px; left: 275px; }
  .gfx-radar .bp6 { width: 11px; height: 11px; top: 195px; left: 185px; }
  @keyframes blink { 0%,100% { opacity: 0.12; } 50% { opacity: 0.7; } }
  .slide.active .gfx-radar .bp1 { animation: blink 2.4s 0.2s ease-in-out infinite; }
  .slide.active .gfx-radar .bp2 { animation: blink 3.1s 0.8s ease-in-out infinite; }
  .slide.active .gfx-radar .bp3 { animation: blink 2.7s 1.2s ease-in-out infinite; }
  .slide.active .gfx-radar .bp4 { animation: blink 3.5s 0.5s ease-in-out infinite; }
  .slide.active .gfx-radar .bp5 { animation: blink 2.9s 1.5s ease-in-out infinite; }
  .slide.active .gfx-radar .bp6 { animation: blink 2.2s 0.3s ease-in-out infinite; }
  .gfx-radar .tick {
    position: absolute; background: rgba(0,8,19,0.07);
    width: 2px; height: 12px; top: 50%; left: 50%;
    transform-origin: center 190px;
  }
  .gfx-radar .t0 { transform: translate(-50%,-190px) rotate(0deg); }
  .gfx-radar .t1 { transform: translate(-50%,-190px) rotate(30deg); }
  .gfx-radar .t2 { transform: translate(-50%,-190px) rotate(60deg); }
  .gfx-radar .t3 { transform: translate(-50%,-190px) rotate(90deg); }
  .gfx-radar .t4 { transform: translate(-50%,-190px) rotate(120deg); }
  .gfx-radar .t5 { transform: translate(-50%,-190px) rotate(150deg); }
  .gfx-radar .t6 { transform: translate(-50%,-190px) rotate(180deg); }
  .gfx-radar .t7 { transform: translate(-50%,-190px) rotate(210deg); }
  .gfx-radar .t8 { transform: translate(-50%,-190px) rotate(240deg); }
  .gfx-radar .t9 { transform: translate(-50%,-190px) rotate(270deg); }
  .gfx-radar .t10 { transform: translate(-50%,-190px) rotate(300deg); }
  .gfx-radar .t11 { transform: translate(-50%,-190px) rotate(330deg); }

  /* ═════ SLIDE 2: UPWARD ARROWS (impact) ═════ */
  .gfx-arrows {
    top: 60px; right: 50px; width: 400px; height: 400px;
  }
  .gfx-arrows .bar {
    position: absolute; bottom: 60px;
    width: 28px; border-radius: 6px 6px 0 0;
    background: rgba(24,148,201,0.1);
  }
  .gfx-arrows .b1 { left: 40px; height: 80px; }
  .gfx-arrows .b2 { left: 90px; height: 140px; }
  .gfx-arrows .b3 { left: 140px; height: 200px; }
  .gfx-arrows .b4 { left: 190px; height: 170px; }
  .gfx-arrows .b5 { left: 240px; height: 260px; }
  .gfx-arrows .b6 { left: 290px; height: 310px; }
  @keyframes grow-bar {
    0% { transform: scaleY(0); } 100% { transform: scaleY(1); }
  }
  .gfx-arrows .bar { transform-origin: bottom; }
  .slide.active .gfx-arrows .b1 { animation: grow-bar 0.8s 0.3s cubic-bezier(0.4,0,0.2,1) both; }
  .slide.active .gfx-arrows .b2 { animation: grow-bar 0.8s 0.42s cubic-bezier(0.4,0,0.2,1) both; }
  .slide.active .gfx-arrows .b3 { animation: grow-bar 0.8s 0.54s cubic-bezier(0.4,0,0.2,1) both; }
  .slide.active .gfx-arrows .b4 { animation: grow-bar 0.8s 0.66s cubic-bezier(0.4,0,0.2,1) both; }
  .slide.active .gfx-arrows .b5 { animation: grow-bar 0.8s 0.78s cubic-bezier(0.4,0,0.2,1) both; }
  .slide.active .gfx-arrows .b6 { animation: grow-bar 0.8s 0.9s cubic-bezier(0.4,0,0.2,1) both; }
  .gfx-arrows .trend {
    position: absolute; bottom: 58px; left: 54px;
    width: 280px; height: 2px;
    background: linear-gradient(90deg, transparent, #E0B848);
    transform: rotate(-32deg); transform-origin: left bottom;
    opacity: 0.3;
  }
  .gfx-arrows .dot-top {
    position: absolute; top: 40px; right: 60px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #E0B848; opacity: 0.25;
  }
  @keyframes float-dot {
    0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); }
  }
  .slide.active .gfx-arrows .dot-top { animation: float-dot 3s ease-in-out infinite; }
  .gfx-arrows .baseline {
    position: absolute; bottom: 58px; left: 30px;
    width: 300px; height: 1.5px; background: rgba(0,8,19,0.06);
  }

  /* ═════ SLIDE 3: CHECKLIST (prep) ═════ */
  .gfx-check {
    top: 50px; right: 40px; width: 400px; height: 420px;
  }
  .gfx-check .box {
    position: absolute;
    width: 220px; border-radius: 12px;
    background: rgba(0,8,19,0.025);
    border: 1.5px solid rgba(0,8,19,0.06);
    padding: 16px 18px;
    display: flex; align-items: center; gap: 12px;
  }
  .gfx-check .b1 { top: 30px; left: 40px; }
  .gfx-check .b2 { top: 100px; left: 80px; }
  .gfx-check .b3 { top: 170px; left: 50px; }
  .gfx-check .b4 { top: 240px; left: 90px; }
  .gfx-check .b5 { top: 310px; left: 60px; }
  .gfx-check .check-sq {
    width: 22px; height: 22px; border-radius: 5px;
    border: 2px solid rgba(224,184,72,0.25);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .gfx-check .check-fill {
    width: 12px; height: 12px; border-radius: 3px;
    background: #E0B848; opacity: 0;
  }
  @keyframes check-in {
    0% { opacity: 0; transform: scale(0); }
    100% { opacity: 1; transform: scale(1); }
  }
  .slide.active .gfx-check .b1 .check-fill { animation: check-in 0.3s 0.6s cubic-bezier(0.4,0,0.2,1) both; }
  .slide.active .gfx-check .b2 .check-fill { animation: check-in 0.3s 0.9s cubic-bezier(0.4,0,0.2,1) both; }
  .slide.active .gfx-check .b3 .check-fill { animation: check-in 0.3s 1.2s cubic-bezier(0.4,0,0.2,1) both; }
  .slide.active .gfx-check .b4 .check-fill { animation: check-in 0.3s 1.5s cubic-bezier(0.4,0,0.2,1) both; }
  .slide.active .gfx-check .b5 .check-fill { animation: check-in 0.3s 1.8s cubic-bezier(0.4,0,0.2,1) both; }
  .gfx-check .line-placeholder {
    height: 8px; border-radius: 4px;
    background: rgba(0,8,19,0.04); flex: 1;
  }
  .gfx-check .connector {
    position: absolute; left: 51px; top: 68px;
    width: 1.5px; height: 266px;
    background: rgba(224,184,72,0.1);
  }

  /* ═════ SLIDE 4: PATH (arrows forward) ═════ */
  .gfx-path {
    top: 50px; right: 30px; width: 430px; height: 420px;
  }
  .gfx-path .node {
    position: absolute; width: 48px; height: 48px;
    border-radius: 12px; border: 2px solid rgba(0,8,19,0.08);
    background: rgba(0,8,19,0.02);
  }
  .gfx-path .n1 { top: 40px; left: 30px; }
  .gfx-path .n2 { top: 120px; left: 150px; }
  .gfx-path .n3 { top: 200px; left: 60px; }
  .gfx-path .n4 { top: 280px; left: 200px; }
  .gfx-path .n5 { top: 340px; left: 320px; border-color: rgba(224,184,72,0.2); }
  .gfx-path .n5-glow {
    position: absolute; top: 348px; left: 328px;
    width: 32px; height: 32px; border-radius: 8px;
    background: #E0B848;
    box-shadow: 0 0 0 8px rgba(224,184,72,0.1);
  }
  @keyframes end-glow {
    0%,100% { box-shadow: 0 0 0 8px rgba(224,184,72,0.1); }
    50% { box-shadow: 0 0 0 14px rgba(224,184,72,0.2), 0 0 20px rgba(224,184,72,0.08); }
  }
  .slide.active .gfx-path .n5-glow { animation: end-glow 3s ease-in-out infinite; }
  .gfx-path .path-line {
    position: absolute; height: 2px;
    background: rgba(0,8,19,0.06); transform-origin: left center;
  }
  .gfx-path .pl1 { top: 64px; left: 78px; width: 100px; transform: rotate(30deg); }
  .gfx-path .pl2 { top: 148px; left: 110px; width: 80px; transform: rotate(140deg); }
  .gfx-path .pl3 { top: 228px; left: 108px; width: 120px; transform: rotate(20deg); }
  .gfx-path .pl4 { top: 310px; left: 248px; width: 90px; transform: rotate(20deg); }
  .gfx-path .flow-dot {
    position: absolute; width: 6px; height: 6px;
    border-radius: 50%; background: #1894C9;
  }
  @keyframes travel-1 {
    0% { top: 58px; left: 78px; opacity: 0; }
    20% { opacity: 0.6; } 80% { opacity: 0.6; }
    100% { top: 118px; left: 150px; opacity: 0; }
  }
  @keyframes travel-2 {
    0% { top: 140px; left: 150px; opacity: 0; }
    20% { opacity: 0.6; } 80% { opacity: 0.6; }
    100% { top: 198px; left: 78px; opacity: 0; }
  }
  @keyframes travel-3 {
    0% { top: 218px; left: 108px; opacity: 0; }
    20% { opacity: 0.6; } 80% { opacity: 0.6; }
    100% { top: 280px; left: 200px; opacity: 0; }
  }
  @keyframes travel-4 {
    0% { top: 298px; left: 248px; opacity: 0; }
    20% { opacity: 0.6; } 80% { opacity: 0.6; }
    100% { top: 340px; left: 320px; opacity: 0; }
  }
  .slide.active .gfx-path .fd1 { animation: travel-1 2.5s 0s ease-in-out infinite; }
  .slide.active .gfx-path .fd2 { animation: travel-2 2.5s 0.6s ease-in-out infinite; }
  .slide.active .gfx-path .fd3 { animation: travel-3 2.5s 1.2s ease-in-out infinite; }
  .slide.active .gfx-path .fd4 { animation: travel-4 2.5s 1.8s ease-in-out infinite; }

  /* ── NAV ── */
  .nav {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 14px; z-index: 100;
  }
  .nav-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(224,184,72,0.25);
    cursor: pointer; transition: all 0.4s ease;
    border: none; outline: none;
  }
  .nav-dot.active {
    background: #E0B848;
    box-shadow: 0 0 12px rgba(224,184,72,0.4);
    transform: scale(1.3);
  }
  .counter {
    position: fixed; top: 28px; right: 36px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600; font-size: 13px;
    color: rgba(224,184,72,0.5);
    letter-spacing: 3px; z-index: 100;
  }
</style>
</head>
<body>

<div class="slideshow">

  <!-- ════════ SLIDE 1 ════════ -->
  <div class="slide active" data-index="0">
    <div class="corner-tl"></div>
    <div class="corner-br"></div>
    <div class="gfx gfx-radar">
      <div class="ring r1"></div><div class="ring r2"></div>
      <div class="ring r3"></div><div class="ring r4"></div>
      <div class="tick t0"></div><div class="tick t1"></div><div class="tick t2"></div>
      <div class="tick t3"></div><div class="tick t4"></div><div class="tick t5"></div>
      <div class="tick t6"></div><div class="tick t7"></div><div class="tick t8"></div>
      <div class="tick t9"></div><div class="tick t10"></div><div class="tick t11"></div>
      <div class="sweep"></div><div class="core"></div>
      <div class="blip bp1"></div><div class="blip bp2"></div><div class="blip bp3"></div>
      <div class="blip bp4"></div><div class="blip bp5"></div><div class="blip bp6"></div>
    </div>
    <div class="gold-line"></div>
    <h1>Learn Each<br>Unreleased Feature</h1>
    <p class="tagline">Six features found in leaked source. None public yet.</p>
  </div>

  <!-- ════════ SLIDE 2 ════════ -->
  <div class="slide slide-workflow" data-index="1">
    <div class="corner-tl"></div>
    <div class="corner-br"></div>
    <div class="gfx gfx-arrows">
      <div class="baseline"></div>
      <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div>
      <div class="bar b4"></div><div class="bar b5"></div><div class="bar b6"></div>
      <div class="trend"></div>
      <div class="dot-top"></div>
    </div>
    <div class="gold-line"></div>
    <h1>Why They Matter<br>for Your Workflow</h1>
    <p class="tagline">The gap between knowing and doing just got smaller.</p>
  </div>

  <!-- ════════ SLIDE 3 ════════ -->
  <div class="slide slide-prep" data-index="2">
    <div class="corner-tl"></div>
    <div class="corner-br"></div>
    <div class="gfx gfx-check">
      <div class="connector"></div>
      <div class="box b1"><div class="check-sq"><div class="check-fill"></div></div><div class="line-placeholder"></div></div>
      <div class="box b2"><div class="check-sq"><div class="check-fill"></div></div><div class="line-placeholder"></div></div>
      <div class="box b3"><div class="check-sq"><div class="check-fill"></div></div><div class="line-placeholder"></div></div>
      <div class="box b4"><div class="check-sq"><div class="check-fill"></div></div><div class="line-placeholder"></div></div>
      <div class="box b5"><div class="check-sq"><div class="check-fill"></div></div><div class="line-placeholder"></div></div>
    </div>
    <div class="gold-line"></div>
    <h1>What to Do<br>Before They Go Live</h1>
    <p class="tagline">Preparation now. Advantage later.</p>
  </div>

  <!-- ════════ SLIDE 4 ════════ -->
  <div class="slide slide-action" data-index="3">
    <div class="corner-tl"></div>
    <div class="corner-br"></div>
    <div class="gfx gfx-path">
      <div class="path-line pl1"></div><div class="path-line pl2"></div>
      <div class="path-line pl3"></div><div class="path-line pl4"></div>
      <div class="node n1"></div><div class="node n2"></div><div class="node n3"></div>
      <div class="node n4"></div><div class="node n5"></div>
      <div class="n5-glow"></div>
      <div class="flow-dot fd1"></div><div class="flow-dot fd2"></div>
      <div class="flow-dot fd3"></div><div class="flow-dot fd4"></div>
    </div>
    <div class="gold-line"></div>
    <h1>Your<br>Action Path</h1>
    <p class="tagline">Concrete steps. No guesswork.</p>
  </div>

</div>

<div class="nav">
  <button class="nav-dot active" data-goto="0"></button>
  <button class="nav-dot" data-goto="1"></button>
  <button class="nav-dot" data-goto="2"></button>
  <button class="nav-dot" data-goto="3"></button>
</div>
<div class="counter"><span id="current">1</span> / 4</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.nav-dot');
  const counter = document.getElementById('current');
  let current = 0;
  let transitioning = false;

  function goTo(idx) {
    if (idx === current || transitioning) return;
    transitioning = true;
    const dir = idx > current ? 1 : -1;
    slides[current].classList.remove('active');
    slides[current].classList.add(dir > 0 ? 'prev' : 'next');
    slides[idx].classList.remove('prev','next');
    slides[idx].classList.add('active');
    dots[current].classList.remove('active');
    dots[idx].classList.add('active');
    counter.textContent = idx + 1;
    const old = current;
    current = idx;
    setTimeout(() => {
      slides[old].classList.remove('prev','next');
      transitioning = false;
    }, 900);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
      e.preventDefault();
      if (current < slides.length - 1) goTo(current + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (current > 0) goTo(current - 1);
    }
  });

  dots.forEach(d => d.addEventListener('click', () => goTo(+d.dataset.goto)));

  document.querySelector('.slideshow').addEventListener('click', (e) => {
    if (e.target.closest('.nav-dot')) return;
    if (current < slides.length - 1) goTo(current + 1);
    else goTo(0);
  });
</script>

</body>
</html>
